<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Metal Art Sialkot - User Account</title>
    
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --gold: #C4A265;
            --gold-light: #D4B87A;
            --dark: #1A1815;
            --dark-light: #2C2824;
            --cream: #FAF7F2;
            --cream-dark: #F5F0E8;
            --green: #1B5E20;
            --red: #E53935;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1A1815, #2C2824); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .auth-container { background: white; border-radius: 24px; max-width: 450px; width: 100%; padding: 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); position: relative; }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo img { width: 80px; height: 80px; border-radius: 16px; border: 3px solid var(--gold); margin-bottom: 15px; object-fit: contain; background: #F5F0E8; }
        .auth-logo h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--dark); }
        .auth-logo p { font-size: 11px; color: #8B7355; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }
        
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .auth-tab { flex: 1; padding: 12px; border-radius: 50px; border: 2px solid var(--gold); background: white; color: var(--gold); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s; }
        .auth-tab.active { background: var(--gold); color: white; }
        
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: #333; }
        .form-group label .required { color: var(--red); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; font-size: 16px; }
        .input-wrapper input { width: 100%; padding: 14px 16px 14px 45px; border: 2px solid #E8E0D5; border-radius: 12px; font-size: 14px; transition: all 0.3s; font-family: 'Inter', sans-serif; }
        .input-wrapper input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(196,162,101,0.2); }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #999; }
        
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; }
        .remember-forgot label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .remember-forgot a { color: var(--gold); text-decoration: none; font-weight: 600; }
        
        .auth-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #C4A265, #D4B87A); color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { box-shadow: 0 10px 30px rgba(196, 162, 101, 0.4); transform: translateY(-2px); }
        
        .auth-divider { text-align: center; margin: 20px 0; position: relative; }
        .auth-divider::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #E8E0D5; }
        .auth-divider span { background: white; padding: 0 15px; position: relative; font-size: 12px; color: #999; }
        .back-home { display: block; text-align: center; margin-top: 20px; color: #999; text-decoration: none; font-size: 13px; }
        .back-home:hover { color: var(--gold); }
        
        .profile-view { display: none; text-align: center; }
        .profile-view.active { display: block; animation: fadeIn 0.5s ease; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #C4A265, #D4B87A); display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: 700; margin: 0 auto 20px; }
        .profile-name { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--dark); margin-bottom: 5px; }
        .profile-email { font-size: 13px; color: #666; margin-bottom: 20px; }
        .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .profile-stat { background: var(--cream-dark); padding: 15px; border-radius: 12px; }
        .profile-stat-number { font-size: 20px; font-weight: 700; color: var(--gold); }
        .profile-stat-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
        .logout-btn { width: 100%; padding: 14px; background: var(--dark); color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .logout-btn:hover { background: #333; }
        
        /* Social Icons */
        .social-login { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .social-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #E8E0D5; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; text-decoration: none; font-size: 16px; }
        .social-btn:hover { transform: translateY(-3px); }
        
        @media (max-width: 480px) {
            .auth-container { padding: 25px; }
            .auth-logo h1 { font-size: 24px; }
            .auth-logo img { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="images/logo.png" alt="Metal Art Sialkot" onerror="this.onerror=null;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23C4A265%22/><text x=%2250%22 y=%2270%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22>M</text></svg>'">
            <h1>Metal Art Sialkot</h1>
            <p>Premium Islamic Art</p>
        </div>
        
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="showAuthTab('signup')">Sign Up</button>
        </div>
        
        <div class="auth-form active" id="loginForm">
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" id="rememberMe"> Remember me</label>
                    <a href="#" onclick="forgotPassword()">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            
            <div class="auth-divider"><span>or continue with</span></div>
            <div class="social-login">
                <a href="https://www.instagram.com/metalartsialkot/" target="_blank" class="social-btn" style="color:#E4405F;"><i class="fab fa-instagram"></i></a>
                <a href="https://www.facebook.com/metalartsialkot" target="_blank" class="social-btn" style="color:#1877F2;"><i class="fab fa-facebook-f"></i></a>
                <a href="https://wa.me/923099915777" target="_blank" class="social-btn" style="color:#25D366;"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
        
        <div class="auth-form" id="signupForm">
            <form onsubmit="signup(event)">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="e.g., Ahmed Khan" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="signupPhone" placeholder="e.g., 0300-1234567" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" minlength="6" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="auth-btn"><i class="fas fa-user-plus"></i> Create Account</button>
            </form>
        </div>
        
        <div class="profile-view" id="profileView">
            <div class="profile-avatar" id="profileAvatar">A</div>
            <div class="profile-name" id="profileName">---</div>
            <div class="profile-email" id="profileEmail">---</div>
            <div class="profile-stats">
                <div class="profile-stat"><div class="profile-stat-number" id="profileOrders">0</div><div class="profile-stat-label">Orders</div></div>
                <div class="profile-stat"><div class="profile-stat-number" id="profilePromos">0</div><div class="profile-stat-label">Promos</div></div>
                <div class="profile-stat"><div class="profile-stat-number" id="profileReviews">0</div><div class="profile-stat-label">Reviews</div></div>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="auth-divider"><span>or</span></div>
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
    
    <script>
        function showAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('profileView').classList.remove('active');
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
            }
        }
        
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
            else { input.type = 'password'; icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
        }
        
        function login(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) { alert('⚠️ Please fill all fields!'); return; }
            
            if (email === 'admin@metalartsialkot.com' && password === 'admin123') {
                localStorage.setItem('metalUser', JSON.stringify({name:'Admin', email, phone:'03009991577', role:'admin'}));
                alert('✅ Welcome Admin!');
                window.location.href = 'dashboard.html';
                return;
            }
            if (email === 'manager@metalartsialkot.com' && password === 'manager123') {
                localStorage.setItem('metalUser', JSON.stringify({name:'Manager', email, phone:'03009991578', role:'manager'}));
                alert('✅ Welcome Manager!');
                window.location.href = 'dashboard.html';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('metalUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                user.role = 'customer';
                localStorage.setItem('metalUser', JSON.stringify(user));
                showProfile(user);
                alert('✅ Welcome back, ' + user.name + '!');
            } else {
                alert('❌ Invalid email or password!');
            }
        }
        
        function signup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            if (!name || !email || !phone || !password) { alert('⚠️ Please fill all fields!'); return; }
            if (password.length < 6) { alert('⚠️ Password must be at least 6 characters!'); return; }
            
            const users = JSON.parse(localStorage.getItem('metalUsers') || '[]');
            if (users.find(u => u.email === email)) { alert('❌ Email already registered!'); return; }
            
            const newUser = {name, email, phone, password, role:'customer', createdAt: new Date().toISOString()};
            users.push(newUser);
            localStorage.setItem('metalUsers', JSON.stringify(users));
            localStorage.setItem('metalUser', JSON.stringify(newUser));
            showProfile(newUser);
            alert('✅ Account created successfully!');
        }
        
        function showProfile(user) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('profileView').classList.add('active');
            document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = user.name;
            document.getElementById('profileEmail').textContent = '📧 ' + user.email;
            
            const orders = JSON.parse(localStorage.getItem('metalOrders') || '[]');
            document.getElementById('profileOrders').textContent = orders.filter(o => o.email === user.email).length;
            const promos = JSON.parse(localStorage.getItem('metalPromoCodes') || '[]');
            document.getElementById('profilePromos').textContent = promos.filter(p => p.email === user.email).length;
            const reviews = JSON.parse(localStorage.getItem('metalReviews') || '[]');
            document.getElementById('profileReviews').textContent = reviews.filter(r => r.email === user.email).length;
        }
        
        function logout() {
            localStorage.removeItem('metalUser');
            showAuthTab('login');
            alert('✅ Logged out successfully!');
        }
        
        function forgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) { alert('⚠️ Please enter your email first!'); return; }
            alert('📧 Password reset link sent to ' + email);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('metalUser') || 'null');
            if (currentUser) {
                if (currentUser.role === 'admin' || currentUser.role === 'manager') {
                    window.location.href = 'dashboard.html';
                } else {
                    showProfile(currentUser);
                }
            }
        });
    </script>
</body>
</html>
