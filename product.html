            --cream: #FAF7F2;

            width: 100%;

        .premium-nav.scrolled {

        }
        
        .nav-container {

            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

        .nav-logo {

            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }
        
        .nav-logo img {

            height: 45px;
            border-radius: 10px;
            object-fit: contain;
            border: 2px solid var(--gold);
        }
        
        .nav-logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
        }
        
        .nav-logo-sub {

            color: #8B7355;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        
        .nav-links {
            display: flex;
            gap: 18px;
            list-style: none;
        }
        
        .nav-links a {
            color: var(--dark);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            padding: 5px 0;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after,
        .nav-links a.active::after {

        }
        
        .nav-actions {

            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .nav-icon-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            color: var(--dark);
            padding: 8px;
            transition: all 0.3s;
            border-radius: 50%;
        }
        
        .nav-icon-btn:hover {
            background: var(--cream-dark);
            color: var(--gold);
        }
        
        .nav-cart-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--red);
            color: white;
            font-size: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--dark);
        }
        
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            background: white;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 999;
        }
        
        .mobile-menu.active {
            display: block;
        }
        
        .mobile-menu a {
            display: block;
            padding: 12px;
            color: var(--dark);
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

            max-width: 1400px;
            margin: 0 auto;
        }

            font-size: 11px;
            color: #999;
            margin-bottom: 30px;
        }
        
        .breadcrumb a {
            color: var(--gold);
            text-decoration: none;
        }
        
        .breadcrumb span {
            margin: 0 8px;
        }
        
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }
        
        .product-detail-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .product-detail-image img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        
        .product-detail-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--gold);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            letter-spacing: 1px;
        }
        
        .product-detail-info h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            color: var(--dark);
            margin-bottom: 10px;
        }
        
        .product-rating {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stars {
            color: #FFB300;
            font-size: 18px;
        }
        
        .rating-text {
            font-size: 12px;
            color: #666;
        }
        
        .product-price-box {

            margin-bottom: 20px;
            border: 1px solid rgba(196,162,101,0.2);

        .current-price {

            font-weight: 800;
            color: var(--gold);
        }
        
        .original-price {

            color: #999;
            text-decoration: line-through;
            margin-left: 10px;

            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 10px;

            padding: 10px 0;
            border-bottom: 1px solid #eee;

            min-width: 120px;
            color: #666;

        .meta-item .value {

            font-size: 12px;

            color: #2E7D32;
        }

            color: #E65100;

        }

            0%, 100% { opacity: 1; }

            border: 1px solid rgba(196, 162, 101, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s;
            cursor: pointer;

        .related-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .related-image {
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--cream-dark);

        .related-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

            padding: 15px;
        }

            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
            font-family: 'Cormorant Garamond', serif;

            color: var(--gold);
            font-weight: 700;
            font-size: 16px;

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: white;
            z-index: 999999;
            transition: right 0.4s ease;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .cart-sidebar.open {
            right: 0;
        }
        
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999998;
            display: none;
        }
        
        .cart-overlay.show {
            display: block;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dark);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 9999;
            animation: slideUp 0.5s ease;
            font-size: 13px;
        }
        
        @keyframes slideUp {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .product-detail-grid { gap: 30px; }
            .related-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .product-detail-grid { grid-template-columns: 1fr; }
            .product-detail-info h1 { font-size: 28px; }
            .related-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .action-buttons { flex-direction: column; }
            .nav-logo-text { font-size: 18px; }
        }
        
        @media (max-width: 480px) {
            .product-detail-info h1 { font-size: 24px; }
            .current-price { font-size: 26px; }
            .related-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
        }

            {

                code: "MAS-006",

                price: 6000, 
                img: "images/products/hasbunallah.jpg", 
                best: true, 
                stock: 4, 
                sold: 178, 
                size: '40"W × 10"H',
                material: 'Stainless Steel',
                finish: 'Golden Mirror',
                warranty: '5 Years',
                desc: "Hasbunallah premium wall décor. Golden finish, unbreakable steel. A powerful reminder of faith and trust in Allah.",
                features: [
                    'Premium steel construction',
                    'Golden mirror finish',
                    'Unbreakable',
                    'Easy mounting',
                    '5-year warranty',
                    'Free shipping'
                ]
            },
            {
                id: 7, 
                code: "MAS-007", 
                name: "Fabi Ayyi Ala", 
                cat: "calligraphy", 
                price: 6000, 
                img: "images/products/fabi-ayyi.jpg", 
                best: false, 
                stock: 10, 
                sold: 98, 
                size: '40"W × 10"H',
                material: 'Stainless Steel',
                finish: 'Golden Mirror',
                warranty: '5 Years',
                desc: "Surah Ar-Rahman verse. Premium laser-cut stainless steel with golden finish. Beautiful calligraphy that inspires gratitude.",
                features: [
                    'Surah Ar-Rahman verse',
                    'Laser precision',
                    'Golden finish',
                    'Solid steel',
                    '5-year warranty',
                    'Free shipping'
                ]
            },
            {
                id: 8, 
                code: "MAS-008", 
                name: "La Ilaha Illa Anta", 
                cat: "kalima", 
                price: 6000, 
                img: "images/products/la-ilaha.jpg", 
                best: false, 
                stock: 7, 
                sold: 67, 
                size: '40"W × 10"H',
                material: 'Stainless Steel',
                finish: 'Golden Mirror',
                warranty: '5 Years',
                desc: "Ayat-e-Karima Islamic wall art. Precision fiber laser cut with golden finish. A beautiful addition to any prayer room.",
                features: [
                    'Ayat-e-Karima',
                    'Fiber laser cut',
                    'Golden finish',
                    'Unbreakable',
                    '5-year warranty',
                    'Free shipping'
                ]
            }
        ];
        
        let cart = JSON.parse(localStorage.getItem('metalCart') || '[]');
        let currentProduct = null;
        let quantity = 1;
        
        // ===== GET PRODUCT ID FROM URL =====
        function getProductIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id')) || 1;
        }
        
        // ===== LOAD PRODUCT DETAILS =====
        function loadProductDetail() {
            const productId = getProductIdFromUrl();
            currentProduct = products.find(p => p.id === productId);
            
            if (!currentProduct) {
                currentProduct = products[0];
            }
            
            document.getElementById('breadcrumbProduct').textContent = currentProduct.name;
            document.title = currentProduct.name + ' | Metal Art Sialkot';
            
            const container = document.getElementById('productDetail');
            
            const stockClass = currentProduct.stock <= 5 ? 'stock-low' : 'stock-in';
            const stockText = currentProduct.stock <= 5 ? `🔥 Only ${currentProduct.stock} left!` : '✅ In Stock';
            const badge = currentProduct.best ? '⭐ BESTSELLER' : (currentProduct.cat === 'ayat' ? '👑 PREMIUM' : '');
            
            container.innerHTML = `
                <div class="product-detail-image">
                    ${badge ? `<span class="product-detail-badge">${badge}</span>` : ''}
                    <img src="${currentProduct.img}" alt="${currentProduct.name}" onerror="this.src='https://via.placeholder.com/800x800/C4A265/FFFFFF?text=${encodeURIComponent(currentProduct.name)}'">
                </div>
                
                <div class="product-detail-info">
                    <h1>${currentProduct.name}</h1>
                    
                    <div class="product-rating">
                        <span class="stars">★★★★★</span>
                        <span class="rating-text">4.9/5 (${currentProduct.sold}+ reviews)</span>
                    </div>
                    
                    <div class="product-price-box">
                        <span class="current-price">Rs. ${currentProduct.price.toLocaleString()}</span>
                        <span class="original-price">Rs. ${(currentProduct.price + 1000).toLocaleString()}</span>
                        <span class="discount-badge">SAVE Rs. 1,000</span>
                    </div>
                    
                    <div class="product-meta">
                        <div class="meta-item">
                            <span class="label">Product Code</span>
                            <span class="value" style="font-family:monospace;">${currentProduct.code}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Size</span>
                            <span class="value">${currentProduct.size}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Material</span>
                            <span class="value">${currentProduct.material}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Finish</span>
                            <span class="value">${currentProduct.finish}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Warranty</span>
                            <span class="value">${currentProduct.warranty}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Availability</span>
                            <span class="value">
                                <span class="stock-status ${stockClass}">${stockText}</span>
                            </span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Sold</span>
                            <span class="value">🔥 ${currentProduct.sold}+ pieces sold</span>
                        </div>
                    </div>
                    
                    <div class="quantity-selector">
                        <label>Quantity:</label>
                        <button class="qty-btn" onclick="changeQuantity(-1)">−</button>
                        <span class="qty-display" id="qtyDisplay">1</span>
                        <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn-add-to-cart" onclick="addToCart()">
                            <i class="fas fa-shopping-cart"></i> Add to Cart
                        </button>
                        <button class="btn-buy-now" onclick="buyNow()">
                            <i class="fas fa-bolt"></i> Buy Now
                        </button>
                    </div>
                    
                    <div class="product-description">
                        <h3>Product Description</h3>
                        <p>${currentProduct.desc}</p>
                        
                        <h3 style="margin-top:20px;">Key Features</h3>
                        <ul class="features-list">
                            ${currentProduct.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
            
            // Load related products
            loadRelatedProducts();
        }
        
        // ===== LOAD RELATED PRODUCTS =====
        function loadRelatedProducts() {
            const related = products.filter(p => p.id !== currentProduct.id && p.cat === currentProduct.cat);
            const others = products.filter(p => p.id !== currentProduct.id && p.cat !== currentProduct.cat);
            const allRelated = [...related, ...others].slice(0, 4);
            
            const grid = document.getElementById('relatedGrid');
            grid.innerHTML = allRelated.map(p => `
                <div class="related-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <div class="related-image">
                        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/800x800/C4A265/FFFFFF?text=${encodeURIComponent(p.name)}'">
                    </div>
                    <div class="related-info">
                        <h3 class="related-name">${p.name}</h3>
                        <p class="related-price">Rs. ${p.price.toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // ===== QUANTITY FUNCTIONS =====
        function changeQuantity(delta) {
            quantity = Math.max(1, quantity + delta);
            document.getElementById('qtyDisplay').textContent = quantity;
        }
        
        // ===== CART FUNCTIONS =====
        function addToCart() {
            const existing = cart.find(x => x.id === currentProduct.id);
            if (existing) {
                existing.qty += quantity;
            } else {
                cart.push({...currentProduct, qty: quantity});
            }
            saveCart();
            showToast('✅ Added to cart!');
        }
        
        function buyNow() {
            addToCart();
            toggleCart();
        }
        
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            renderCart();
        }
        
        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeFromCart(id);
                    return;
                }
                saveCart();
                renderCart();
            }
        }
        
        function saveCart() {
            localStorage.setItem('metalCart', JSON.stringify(cart));
            updateCartBadge();
        }
        
        function updateCartBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            const badge = document.getElementById('cartBadge');
            badge.style.display = total > 0 ? 'flex' : 'none';
            badge.textContent = total;
        }
        
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('show');
            if (document.getElementById('cartSidebar').classList.contains('open')) {
                renderCart();
            }
        }
        
        function closeCart() {
            document.getElementById('cartSidebar').classList.remove('open');
            document.getElementById('cartOverlay').classList.remove('show');
        }
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            const footer = document.getElementById('cartFooter');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 0;color:#999;">
                        <i class="fas fa-shopping-cart" style="font-size:50px;color:#ddd;display:block;margin-bottom:15px;"></i>
                        <p>Your cart is empty</p>
                    </div>
                `;
                footer.style.display = 'none';
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f5f0e8;align-items:center;">
                    <img src="${item.img}" style="width:60px;height:60px;object-fit:contain;background:#F5F0E8;border-radius:8px;" onerror="this.src='https://via.placeholder.com/60x60/C4A265/FFFFFF?text=MAS'">
                    <div style="flex:1;">
                        <strong style="font-size:14px;">${item.name}</strong>
                        <p style="color:#C4A265;font-weight:700;font-size:14px;">Rs. ${(item.price * item.qty).toLocaleString()}</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <button onclick="updateCartQty(${item.id},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:white;cursor:pointer;">−</button>
                        <span>${item.qty}</span>
                        <button onclick="updateCartQty(${item.id},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:white;cursor:pointer;">+</button>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="color:#e53935;cursor:pointer;background:none;border:none;font-size:16px;">✕</button>
                </div>
            `).join('');
            
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('cartTotalPrice').textContent = 'Rs. ' + total.toLocaleString();
            footer.style.display = 'block';
        }
        
        function checkout() {
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            window.location.href = 'checkout.html';
        }
        
        // ===== TOAST =====
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ===== MOBILE MENU =====
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
        }
        
        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', () => {
            loadProductDetail();
            updateCartBadge();
            
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('mainNav');
                if (window.scrollY > 50) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>
